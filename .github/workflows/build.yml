name: Build launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build launcher and game host
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path gpui-launcher/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path gpui-launcher/game-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows build
        shell: pwsh
        run: |
          $loader = Get-ChildItem "$env:USERPROFILE\.cargo\registry\src\*\webview2-com-sys-0.39.1\x64\WebView2Loader.dll" | Select-Object -First 1
          if (-not $loader) { throw 'WebView2Loader.dll was not found' }
          python gpui-launcher/scripts/package.py --platform windows --arch x86_64 --launcher gpui-launcher/target/release/breakmine-gpui.exe --game-host gpui-launcher/game-host/target/release/breakmine-game-host.exe --webview2-loader $loader.FullName --output dist/Breakmine-Launcher-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        shell: pwsh
        run: |
          Expand-Archive -Path dist/Breakmine-Launcher-Windows-x64.zip -DestinationPath dist/installer-input
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" gpui-launcher/packaging/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Breakmine-Launcher-Windows-x64
          path: dist/Breakmine-Launcher-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Breakmine-Launcher-Windows-x64-Setup
          path: dist/Breakmine-Launcher-Windows-x64-Setup.exe
          if-no-files-found: error

  linux:
    name: Linux x64 AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libfuse2 libgtk-3-dev libvulkan-dev libwayland-dev libwebkit2gtk-4.1-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev patchelf
      - name: Build launcher and game host
        run: |
          cargo build --locked --release --manifest-path gpui-launcher/Cargo.toml
          cargo build --locked --release --manifest-path gpui-launcher/game-host/Cargo.toml
      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin/assets staging
          cp -a src/assets/. AppDir/usr/bin/assets/
          cp -a gpui-launcher/assets/. AppDir/usr/bin/assets/
          chmod -R a+rX AppDir/usr/bin/assets
          cp gpui-launcher/target/release/breakmine-gpui staging/breakmine-launcher
          cp src/assets/logo.png staging/breakmine-launcher.png
          curl -fL --retry 3 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage --appdir AppDir \
            --executable staging/breakmine-launcher \
            --executable gpui-launcher/game-host/target/release/breakmine-game-host \
            --desktop-file gpui-launcher/packaging/breakmine-launcher.desktop \
            --icon-file staging/breakmine-launcher.png
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          OUTPUT: Breakmine-Launcher-Linux-x64.AppImage
        run: ./linuxdeploy.AppImage --appdir AppDir --output appimage
      - uses: actions/upload-artifact@v4
        with:
          name: Breakmine-Launcher-Linux-x64
          path: Breakmine-Launcher-Linux-x64.AppImage
          if-no-files-found: error
