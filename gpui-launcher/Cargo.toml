[package]
name = "breakmine-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "=0.2.2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
unicode-segmentation = "1"
url = "2"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.dev]
debug = 0
incremental = false

# The 3D skin preview is drawn on the CPU; it needs optimisation even in dev builds.
[profile.dev.package.breakmine-gpui]
opt-level = 2

# Compatibility for zed-async-tar on recent libc versions.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
